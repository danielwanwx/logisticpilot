<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f7f4" />
    <title>LogisticPilot · Opening and architecture</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #123e2e;
        --muted: #60716a;
        --line: #d9e5de;
        --canvas: #f3f7f4;
        --surface: #ffffff;
        --accent: #109c70;
        --accent-dark: #0e573d;
        --shadow: 0 24px 64px rgba(21, 69, 51, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
        padding: clamp(24px, 5vw, 64px) 0 48px;
      }

      .topbar,
      .preview-footer,
      .meta-list,
      .action-row {
        display: flex;
        align-items: center;
      }

      .topbar {
        justify-content: space-between;
        gap: 24px;
        margin-bottom: clamp(48px, 8vw, 92px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
        font-size: 15px;
        font-weight: 760;
        letter-spacing: -0.03em;
      }

      .brand-mark {
        display: grid;
        grid-template-columns: repeat(2, 4px);
        gap: 3px;
        place-content: center;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: var(--accent-dark);
      }

      .brand-mark i {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #b7f1d7;
      }

      .eyebrow,
      .tag {
        color: var(--muted);
        font-size: 11px;
        font-weight: 780;
        letter-spacing: 0.13em;
        line-height: 1;
        text-transform: uppercase;
      }

      .eyebrow {
        padding: 10px 13px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.54);
      }

      .intro {
        max-width: 760px;
      }

      h1 {
        max-width: 680px;
        margin: 0;
        color: var(--ink);
        font-size: clamp(34px, 6vw, 68px);
        font-weight: 760;
        letter-spacing: -0.065em;
        line-height: 0.98;
      }

      .intro p {
        max-width: 590px;
        margin: 22px 0 0;
        color: var(--muted);
        font-size: clamp(16px, 2vw, 19px);
        letter-spacing: -0.02em;
        line-height: 1.45;
      }

      .preview-card {
        margin-top: clamp(32px, 5vw, 56px);
        overflow: hidden;
        border: 1px solid rgba(181, 207, 194, 0.86);
        border-radius: 24px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .player {
        position: relative;
        isolation: isolate;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: #e7f0ea;
      }

      video,
      .poster-overlay,
      .poster-overlay img {
        display: block;
        width: 100%;
        height: 100%;
      }

      video {
        position: relative;
        z-index: 1;
        object-fit: contain;
        background: #e7f0ea;
      }

      .poster-overlay {
        position: absolute;
        z-index: 2;
        inset: 0;
        pointer-events: none;
        transition: opacity 160ms ease;
      }

      .poster-overlay[hidden] {
        display: block;
        opacity: 0;
        visibility: hidden;
      }

      .poster-overlay img {
        object-fit: contain;
      }

      .poster-trigger {
        position: absolute;
        top: 50%;
        left: 50%;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 48px;
        padding: 7px 16px 7px 8px;
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 999px;
        background: rgba(14, 87, 61, 0.94);
        box-shadow: 0 10px 28px rgba(9, 59, 41, 0.25);
        color: white;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 720;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        transition: background 160ms ease, transform 160ms ease;
      }

      .poster-trigger:hover {
        background: #0a6a49;
        transform: translate(-50%, -50%) scale(1.025);
      }

      .poster-trigger:focus-visible,
      .download:focus-visible {
        outline: 3px solid rgba(16, 156, 112, 0.42);
        outline-offset: 3px;
      }

      .play-icon {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #16b77f;
      }

      .play-icon::before {
        width: 0;
        height: 0;
        margin-left: 2px;
        border-top: 6px solid transparent;
        border-bottom: 6px solid transparent;
        border-left: 9px solid white;
        content: "";
      }

      .preview-footer {
        justify-content: space-between;
        gap: 24px;
        padding: 22px 26px 24px;
      }

      .meta-list {
        flex-wrap: wrap;
        gap: 10px 16px;
      }

      .meta-list span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 620;
      }

      .meta-list span + span::before {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #91b4a3;
        content: "";
      }

      .download {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 10px;
        padding: 12px 15px;
        border: 1px solid #b7d9c8;
        border-radius: 12px;
        color: var(--accent-dark);
        font-size: 13px;
        font-weight: 760;
        text-decoration: none;
        transition: background 160ms ease, border-color 160ms ease;
      }

      .download:hover {
        border-color: #85c3a7;
        background: #eff9f3;
      }

      .download svg {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .fallback {
        position: absolute;
        inset: auto 24px 24px;
        z-index: 3;
        padding: 12px 16px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.93);
        color: var(--ink);
        font-size: 13px;
      }

      .fallback a {
        color: var(--accent-dark);
        font-weight: 740;
      }

      @media (max-width: 640px) {
        .page {
          width: min(100% - 24px, 1120px);
          padding-top: 18px;
        }

        .topbar {
          margin-bottom: 48px;
        }

        .eyebrow {
          padding: 9px 10px;
          font-size: 9px;
          letter-spacing: 0.1em;
        }

        .preview-card {
          border-radius: 18px;
        }

        .preview-footer {
          align-items: flex-start;
          flex-direction: column;
          gap: 18px;
          padding: 18px;
        }

        .download {
          width: 100%;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div class="brand" aria-label="LogisticPilot">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span>LogisticPilot</span>
        </div>
        <span class="eyebrow">Opening + architecture</span>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">Why I built LogisticPilot</h1>
        <p>First-person introduction and system walkthrough.</p>
      </section>

      <section class="preview-card" aria-label="Opening and architecture preview video">
        <div class="player">
          <video
            data-video
            controls
            playsinline
            preload="metadata"
            poster="opening-architecture-v2-poster.jpg"
          >
            <source src="opening-architecture-v2.mp4" type="video/mp4" />
            <p class="fallback">Your browser cannot play this video. <a href="opening-architecture-v2.mp4">Download the MP4</a>.</p>
          </video>

          <div class="poster-overlay" data-poster-overlay>
            <img src="opening-architecture-v2-poster.jpg" alt="Opening and architecture preview poster" />
            <button class="poster-trigger" data-play type="button" aria-label="Play opening preview">
              <span class="play-icon" aria-hidden="true"></span>
              <span>Play opening preview</span>
            </button>
          </div>
        </div>

        <div class="preview-footer">
          <div class="meta-list" aria-label="Video details">
            <span>47 sec</span>
            <span>1080p</span>
            <span>H.264 · AAC</span>
          </div>
          <div class="action-row">
            <a class="download" href="opening-architecture-v2.mp4" download>
              Download MP4
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3v12"></path>
                <path d="m7 10 5 5 5-5"></path>
                <path d="M5 21h14"></path>
              </svg>
            </a>
          </div>
        </div>
      </section>
    </main>

    <script>
      (() => {
        const video = document.querySelector('[data-video]');
        const overlay = document.querySelector('[data-poster-overlay]');
        const playButton = document.querySelector('[data-play]');

        if (!video || !overlay || !playButton) return;

        const showPoster = () => {
          overlay.hidden = false;
          overlay.setAttribute('aria-hidden', 'false');
        };

        const hidePoster = () => {
          overlay.hidden = true;
          overlay.setAttribute('aria-hidden', 'true');
        };

        playButton.addEventListener('click', () => {
          if (video.ended) video.currentTime = 0;
          const playback = video.play();
          if (playback && typeof playback.catch === 'function') playback.catch(showPoster);
        });

        video.addEventListener('play', hidePoster);
        video.addEventListener('ended', showPoster);
        video.addEventListener('error', showPoster);
        showPoster();
      })();
    </script>
  </body>
</html>
